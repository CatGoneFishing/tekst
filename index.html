<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Talen">
<meta name="theme-color" content="#0F2536">
<title>Talen til Bodil</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF0F3; --ink:#14293A; --soft:#5B7385; --line:#C9D6DE;
    --accent:#A8822F; --hide:#D3DEE5; --btn:#FFFFFF;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0F2536; --ink:#E7EEF3; --soft:#8FA6B6; --line:#24435A;
      --accent:#D4AE5C; --hide:#1E3A50; --btn:#16324A; }
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  header{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:16px 22px 0; color:var(--soft); font-size:15px;
  }
  header strong{color:var(--ink); font-weight:600}
  .dots{display:flex; gap:7px; padding:12px 22px 0; flex-wrap:wrap}
  .dot{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
    background:none; color:var(--soft); font:600 12px "Figtree",sans-serif;
    padding:0; cursor:pointer;
  }
  .dot.done{border-color:var(--soft)}
  .dot.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}
  main{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:20px 22px; overflow-y:auto; touch-action:pan-y;
  }
  .stanza{max-width:34rem; width:100%}
  .stanza p{
    margin:0 0 .55em; font-family:"Literata",Georgia,"Times New Roman",serif;
    font-size:clamp(19px,5.2vw,24px); line-height:1.5; min-height:1.5em;
    cursor:pointer; overflow-wrap:break-word;
  }
  .stanza.enter{animation:in .22s ease-out}
  @keyframes in{from{opacity:0; transform:translateX(var(--dir,12px))}to{opacity:1; transform:none}}
  .bar{
    display:block; height:.9em; margin-top:.3em; border-radius:6px; background:var(--hide);
  }
  .letters{letter-spacing:.06em; color:var(--ink)}
  .letters .w{margin-right:.55em; white-space:nowrap}
  .hint{
    text-align:center; color:var(--soft); font-size:14px; min-height:20px; padding:0 22px;
  }
  .modes{
    display:flex; margin:12px 22px 0; border:1.5px solid var(--line); border-radius:12px; overflow:hidden;
  }
  .modes button{
    flex:1; border:0; background:none; color:var(--soft);
    font:600 15px "Figtree",sans-serif; padding:11px 4px; cursor:pointer;
  }
  .modes button + button{border-left:1.5px solid var(--line)}
  .modes button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
  nav{display:flex; gap:12px; padding:12px 22px 18px}
  nav button{
    flex:1; border:1.5px solid var(--line); background:var(--btn); color:var(--ink);
    border-radius:14px; padding:16px 8px; font:600 17px "Figtree",sans-serif; cursor:pointer;
  }
  nav button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  nav button:disabled{opacity:.35; cursor:default}
  button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  @media (prefers-reduced-motion: reduce){ .stanza.enter{animation:none} }
</style>
</head>
<body>
<header>
  <span>Talen til Bodil</span>
  <span id="count"><strong>Vers 1</strong> af 7</span>
</header>
<div class="dots" id="dots" aria-label="Spring til vers"></div>
<main id="main"><div class="stanza" id="stanza" aria-live="polite"></div></main>
<div class="hint" id="hint"></div>
<div class="modes" role="group" aria-label="Øvemåde">
  <button data-mode="read" aria-pressed="true">Læs</button>
  <button data-mode="letters" aria-pressed="false">Forbogstaver</button>
  <button data-mode="hide" aria-pressed="false">Skjult</button>
</div>
<nav>
  <button id="prev">Forrige</button>
  <button id="next" class="primary">Næste</button>
</nav>

<script>
const TALE = [
["Du er for vild, du er for cool, du er alt besværet værd",
 "Du er som ingen anden, du er ekstraordinær",
 "Du sover alt for lidt for du blir ved til du er færdig",
 "Din indsats all around er en guldmedalje værdig"],
["Du står op før solen, før kaffen er klar,",
 "og laver en morgen, som ingen andre har.",
 "Du løfter de tunge og trøster de små,",
 "og når alt går i stykker, får du det alligevel på en eller anden måde til at gå."],
["Din mad gør en mandag til en tre stjerners fest,",
 "og dine kloge råd er dem, jeg synes er allerbedst.",
 "Når du giver mig et kram bliver jeg helt blød som smør",
 "og glemmer næsten alt det der var så træls lige før"],
["Copenhell og moshpit: masser af sved",
 "Lyrik og Louisiana, blive klogere på noget du ikke ved",
 "Det er den helt brede klinge, vi vil begge ha' hele pakken,",
 "fra dansegulvets midte til bålet oppe på bakken."],
["Nicki Minaj, kom an, Dolly Parton, Rest In Peace",
 "Du cykler i læderjakke, men indenunder er der fleece",
 "Stærk som en bjørn, arbejdsom som en okse",
 "Vores vi er som en skov der bare bliver ved med at vokse"],
["Man siger, at størst af alt er kærligheden,",
 "men det er en myte, jeg må rette her ved lejligheden:",
 "Størst af alt er blåhvalen, det ved både du og JEG,",
 "men lige efter blåhvalen kommer min kærlighed til dig."],
["Selvfølgelig valgte du mig, for du nøjes jo kun med det bedste",
 "Jeg har glædet mig vildt til i aften, til at fejre og til at feste",
 "Bodil, du er for vild, du er for cool, du er alt besværet værd",
 "Du er som ingen anden, du er ekstraordinær!"]
];

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let idx = Math.min(Math.max(store.get("tale-idx",0),0), TALE.length-1);
let mode = store.get("tale-mode","read");
if(!["read","letters","hide"].includes(mode)) mode = "read";
let revealed = 0;            // lines shown in hide mode
let opened = new Set();      // lines expanded in letters mode

const $ = id => document.getElementById(id);
const stanzaEl = $("stanza");

function firstLetters(line){
  return line.split(/\s+/).filter(Boolean).map(w => {
    const m = w.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}])[\p{L}\p{N}'’\-]*(.*)$/u);
    return m ? m[1] + m[2] + m[3] : w;
  });
}

function render(dir){
  const lines = TALE[idx];
  stanzaEl.innerHTML = "";
  lines.forEach((line, i) => {
    const p = document.createElement("p");
    if(mode === "read"){
      p.textContent = line;
    } else if(mode === "letters"){
      if(opened.has(i)){ p.textContent = line; }
      else {
        p.className = "letters";
        firstLetters(line).forEach(w => {
          const s = document.createElement("span"); s.className = "w"; s.textContent = w; p.appendChild(s);
        });
      }
      p.onclick = () => { opened.has(i) ? opened.delete(i) : opened.add(i); render(); };
    } else {
      if(i < revealed){ p.textContent = line; }
      else {
        const b = document.createElement("span"); b.className = "bar";
        b.style.width = Math.min(100, 30 + line.length * 1.1) + "%";
        p.appendChild(b);
      }
    }
    stanzaEl.appendChild(p);
  });
  if(dir){
    stanzaEl.style.setProperty("--dir", dir > 0 ? "14px" : "-14px");
    stanzaEl.classList.remove("enter"); void stanzaEl.offsetWidth; stanzaEl.classList.add("enter");
  }

  $("count").innerHTML = "<strong>Vers " + (idx+1) + "</strong> af " + TALE.length;
  document.querySelectorAll(".dot").forEach((d,i) => {
    d.classList.toggle("on", i === idx);
    d.classList.toggle("done", i < idx);
    d.setAttribute("aria-current", i === idx ? "step" : "false");
  });
  document.querySelectorAll(".modes button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false"));

  const hint = $("hint");
  if(mode === "hide"){
    hint.textContent = revealed < lines.length
      ? "Sig linjen højt, og tryk så på verset for at tjekke"
      : "Hele verset er vist";
  } else if(mode === "letters"){
    hint.textContent = "Tryk på en linje for at se den helt";
  } else {
    hint.textContent = "";
  }
  $("prev").disabled = idx === 0;
  $("next").textContent = idx === TALE.length-1 ? "Forfra" : "Næste";
  store.set("tale-idx", idx); store.set("tale-mode", mode);
}

function go(n){
  const target = (n + TALE.length) % TALE.length;
  const dir = target > idx ? 1 : -1;
  if(target === idx) return;
  idx = target; revealed = 0; opened.clear(); render(dir);
}

TALE.forEach((_, i) => {
  const d = document.createElement("button");
  d.className = "dot"; d.textContent = i+1; d.setAttribute("aria-label","Vers " + (i+1));
  d.onclick = () => go(i);
  $("dots").appendChild(d);
});

$("prev").onclick = () => { if(idx > 0) go(idx-1); };
$("next").onclick = () => go(idx === TALE.length-1 ? 0 : idx+1);
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => {
  mode = b.dataset.mode; revealed = 0; opened.clear(); render();
});
$("main").addEventListener("click", e => {
  if(mode === "hide" && revealed < TALE[idx].length){ revealed++; render(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "ArrowRight") $("next").click();
  if(e.key === "ArrowLeft") $("prev").click();
  if(e.key === " " && mode === "hide"){ e.preventDefault(); if(revealed < TALE[idx].length){ revealed++; render(); } }
});

let sx = null, sy = null;
$("main").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("main").addEventListener("touchend", e => {
  if(sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
    if(dx < 0) $("next").click(); else $("prev").click();
  }
  sx = sy = null;
}, {passive:true});

render();
</script>
</body>
</html>
